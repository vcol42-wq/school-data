android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.compiler.execution.strategy=in-process
kapt.use.worker.api=false
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,MULTIDEX_NOT_NEEDED
android.useFullClasspathForDexingTransform=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
