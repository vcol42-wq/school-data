android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.daemon.jvmargs=-Xmx4g -Duser.language=en -Duser.country=US -Dkotlin.daemon.client.alive.check.resend.interval.ms=300 -Dkotlin.daemon.client.alive.check.timeout.ms=1000
kotlin.compiler.execution.strategy=in-process
kapt.use.worker.api=false
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,MULTIDEX_NOT_NEEDED
android.useFullClasspathForDexingTransform=true
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.workers.max=2
