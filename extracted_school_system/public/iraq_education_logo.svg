<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="greenInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Black Ring -->
  <circle cx="250" cy="250" r="245" fill="#000000"/>

  <!-- Golden Ring Base -->
  <circle cx="250" cy="250" r="240" fill="url(#goldOuter)" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#78350f" stroke-width="2"/>

  <!-- Top Banner Arc for REPUBLIC OF IRAQ -->
  <path id="topArc" d="M 60 250 A 190 190 0 0 1 440 250" fill="none"/>
  <!-- Bottom Banner Arc for MINISTRY OF EDUCATION -->
  <path id="bottomArc" d="M 440 250 A 190 190 0 0 1 60 250" fill="none"/>

  <!-- Inner Green Circle Base -->
  <circle cx="250" cy="250" r="185" fill="url(#greenInner)" stroke="#854d0e" stroke-width="6"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Top Text: جمهورية العراق / REPUBLIC OF IRAQ -->
  <text font-family="Arial, sans-serif" font-weight="900" fill="#000000" font-size="26" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">جمهورية العراق • REPUBLIC OF IRAQ</textPath>
  </text>

  <!-- Bottom Text: وزارة التربية / MINISTRY OF EDUCATION -->
  <text font-family="Arial, sans-serif" font-weight="900" fill="#000000" font-size="24" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">وزارة التربية • MINISTRY OF EDUCATION</textPath>
  </text>

  <!-- Central Palm Tree (النخلة المباركة) -->
  <g transform="translate(250, 160) scale(1.1)">
    <!-- Trunk -->
    <path d="M -8 110 L -4 10 Q 0 -10 4 10 L 8 110 Z" fill="#854d0e" stroke="#fef08a" stroke-width="1.5"/>
    <path d="M -8 110 Q 0 120 8 110 L 12 130 Q 0 140 -12 130 Z" fill="#ca8a04"/>

    <!-- Palm Fronds (Leaves) -->
    <path d="M 0 0 Q -40 -30 -80 -20 Q -40 10 0 0" fill="#15803d" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 Q 40 -30 80 -20 Q 40 10 0 0" fill="#15803d" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 Q -60 -50 -100 -50 Q -50 -10 0 0" fill="#166534" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 Q 60 -50 100 -50 Q 50 -10 0 0" fill="#166534" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 Q -30 -60 -50 -90 Q -20 -40 0 0" fill="#22c55e" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 Q 30 -60 50 -90 Q 20 -40 0 0" fill="#22c55e" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 Q 0 -70 0 -100 Q 10 -50 0 0" fill="#4ade80" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- Arabic Calligraphy "اقرأ" & Open Book -->
  <g transform="translate(250, 275) scale(1.1)">
    <!-- Book -->
    <path d="M -70 30 Q -35 15 0 35 Q 35 15 70 30 L 60 50 Q 30 35 0 50 Q -30 35 -60 50 Z" fill="#fef08a" stroke="#854d0e" stroke-width="2"/>
    <!-- Calligraphy Text "اقرأ" -->
    <text x="0" y="5" font-family="'Amiri', 'Tajawal', serif" font-weight="900" font-size="62" fill="#fef08a" text-anchor="middle" stroke="#78350f" stroke-width="2" filter="url(#shadow)">اقرأ</text>
  </g>
</svg>