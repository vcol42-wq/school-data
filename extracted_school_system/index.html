<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام الإدارة المدرسية المتكامل - مديرية تربية ديالى</title>
    <script>
      if (typeof module === 'object') {
        window.nodeModule = module;
        module = undefined;
      }
      window.addEventListener('error', function(e) {
        console.error('GLOBAL WINDOW ERROR:', e.error || e.message, e.filename, e.lineno);
        var errDiv = document.getElementById('root');
        if (errDiv) {
          errDiv.innerHTML = '<div style="direction:ltr;background:#fff1f2;color:#991b1b;padding:30px;font-family:monospace;white-space:pre-wrap;font-size:14px;border:3px solid #f43f5e;margin:20px;border-radius:12px;"><b>[FRONTEND STARTUP ERROR]</b>\n' + (e.error ? (e.error.stack || e.error.message) : e.message) + '\n\nFile: ' + e.filename + ':' + e.lineno + '</div>';
        }
      });
    </script>
    <!-- Google Arabic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
